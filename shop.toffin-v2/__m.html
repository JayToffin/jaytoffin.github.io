<!doctype html><meta charset="utf-8"><body><pre id="o"></pre><script>
var f=document.createElement('iframe');f.style.cssText='width:390px;height:900px';f.src='cart.html';
f.onload=function(){setTimeout(function(){var d=f.contentDocument,W=390,out=['scrollW='+d.documentElement.scrollWidth];
 d.querySelectorAll('body *').forEach(function(e){var r=e.getBoundingClientRect();if(r.right>W+1&&r.width>0){var p=e.parentElement.getBoundingClientRect();if(p.right<=W+1)out.push((e.tagName+'.'+(e.className.baseVal!==undefined?'':e.className)).slice(0,80)+' L'+r.left.toFixed(0)+' R'+r.right.toFixed(0)+' W'+r.width.toFixed(0));}});
 document.getElementById('o').textContent=out.slice(0,25).join('\n');},800);};document.body.appendChild(f);
</script>
